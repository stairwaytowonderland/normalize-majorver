name: 🔄 CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'

    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.repository_id }}-${{ github.ref_name }}'
  cancel-in-progress: false

# Use PAT instead of GITHUB_TOKEN to cause semantic-release to trigger tag pipeline when tag is created.
# 'Fine-grained token' repo permissions: Contents

jobs:
  meta:
    name: Meta
    uses: stairwaytowonderland/.github/.github/workflows/ci-meta.yaml@v1

  test:
    name: Test
    needs: [meta]
    if: needs.meta.outputs.is-release-workflow == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  release:
    name: Release
    needs: [meta]
    if: needs.meta.outputs.is-release-workflow == 'true'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yaml
    with:
      dispatch-workflow: ${{ needs.meta.outputs.has-release-tags != 'true' && 'publish.yaml' || '' }}
    secrets: inherit

  publish:
    name: Publish
    needs: [meta]
    if: needs.meta.outputs.is-publish-workflow == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  normalize-majorver:
    name: Normalize Major Version Tag
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: ./
