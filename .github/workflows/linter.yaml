# This workflow will lint the entire codebase using the
# `super-linter/super-linter` action.
#
# For more information, see the super-linter repository:
#     https://github.com/super-linter/super-linter
name: 🧹 Lint Codebase

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Codebase
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: stairwaytowonderland/.github/.github/workflows/linter.yaml@v1
    secrets: inherit
